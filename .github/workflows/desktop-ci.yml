name: Desktop
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Validate private kernel access
        id: kernel-pin
        env:
          AGENT_TEAM_READ_TOKEN: ${{ secrets.AGENT_TEAM_READ_TOKEN }}
        run: node build/ci-kernel-pin.mjs
      - name: Checkout locked Agent-Team kernel
        uses: actions/checkout@v4
        with:
          repository: CerrorJ/Agent-Team
          ref: ${{ steps.kernel-pin.outputs.commit }}
          token: ${{ secrets.AGENT_TEAM_READ_TOKEN }}
          path: .kernel/source
          persist-credentials: false
      - run: pnpm kernel:assemble
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:packaging
      - run: pnpm package
      - run: pnpm test:e2e
      - name: Packaged application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WEFTPILOT_PACKAGED_EXE = (Resolve-Path release/WeftPilot-win32-x64/WeftPilot.exe).Path
          pnpm test:e2e
      - name: Inspect source changes before installer
        run: |
          git status --short
          git diff --stat
          git diff -- pnpm-lock.yaml package.json pnpm-workspace.yaml
      - name: Assemble unsigned native validation installer
        run: pnpm package:installer --validation --validation-version 0.0.1
      - name: Packaged application (macOS)
        if: runner.os == 'macOS'
        run: |
          export WEFTPILOT_PACKAGED_EXE="$(find "$PWD/release" -path '*/WeftPilot.app/Contents/MacOS/WeftPilot' -print -quit)"
          test -n "$WEFTPILOT_PACKAGED_EXE"
          pnpm test:e2e
