name: Desktop
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
jobs:
  desktop:
    timeout-minutes: 30
    env:
      WEFTPILOT_REQUIRE_NATIVE_CLIPBOARD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Validate private kernel access
        id: kernel-pin
        env:
          AGENT_TEAM_READ_TOKEN: ${{ secrets.AGENT_TEAM_READ_TOKEN }}
        run: node build/ci-kernel-pin.mjs
      - name: Checkout locked Agent-Team kernel
        uses: actions/checkout@v4
        with:
          repository: CerrorJ/Agent-Team
          ref: ${{ steps.kernel-pin.outputs.commit }}
          token: ${{ secrets.AGENT_TEAM_READ_TOKEN }}
          path: .kernel/source
          persist-credentials: false
      - run: pnpm kernel:assemble
      - name: Verify locked kernel regressions
        run: pnpm --dir .kernel/source test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:packaging
      - run: pnpm package
      - run: pnpm test:e2e
      - name: Packaged application (Windows)
        id: windows-packaged
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "started_at=$([DateTime]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $env:WEFTPILOT_PACKAGED_EXE = (Resolve-Path release/WeftPilot-win32-x64/WeftPilot.exe).Path
          $env:WEFTPILOT_E2E_LIFECYCLE = '1'
          $env:WEFTPILOT_E2E_RELEASE_INSPECTOR = '1'
          pnpm test:e2e
      - name: Windows application failure metadata
        if: failure() && runner.os == 'Windows' && steps.windows-packaged.outcome == 'failure'
        shell: pwsh
        run: ./build/windows-test-events.ps1 -StartedAt '${{ steps.windows-packaged.outputs.started_at }}'
      - name: Inspect source changes before installer
        run: |
          git status --short
          git diff --stat
          git diff -- pnpm-lock.yaml package.json pnpm-workspace.yaml
      - name: Assemble unsigned native validation installer
        run: pnpm package:installer --validation --validation-version 0.0.1
      - name: Packaged application (macOS)
        if: runner.os == 'macOS'
        run: |
          export WEFTPILOT_PACKAGED_EXE="$(find "$PWD/release" -path '*/WeftPilot.app/Contents/MacOS/WeftPilot' -print -quit)"
          test -n "$WEFTPILOT_PACKAGED_EXE"
          # 同名应用共享系统Keychain，独立userData不隔离它；先串行排除跨测试进程竞争。
          # 仍使用真实safeStorage，任何不可用照常失败，不使用mock-keychain或明文回退。
          pnpm exec tsx --tsconfig tsconfig.runtime.json --test --test-concurrency=1 tests/e2e/*.test.ts
      - name: Preserve project clipboard UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-clipboard-ui-${{ runner.os }}
          path: .tmp/evidence/project-git-copy-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve requirement UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirement-ui-${{ runner.os }}
          path: |
            .tmp/evidence/requirement-catalog-*.png
            .tmp/evidence/requirement-task-create-*.png
            .tmp/evidence/requirement-metadata-*.png
            .tmp/evidence/project-settings-*.png
            .tmp/evidence/team-catalog-*.png
          if-no-files-found: warn
          retention-days: 7
