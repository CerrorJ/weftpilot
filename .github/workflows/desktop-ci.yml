name: Desktop
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
jobs:
  desktop:
    timeout-minutes: 30
    env:
      WEFTPILOT_REQUIRE_NATIVE_CLIPBOARD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Validate private kernel access
        id: kernel-pin
        env:
          AGENT_TEAM_READ_TOKEN: ${{ secrets.AGENT_TEAM_READ_TOKEN }}
        run: node build/ci-kernel-pin.mjs
      - name: Checkout locked Agent-Team kernel
        uses: actions/checkout@v4
        with:
          repository: CerrorJ/Agent-Team
          ref: ${{ steps.kernel-pin.outputs.commit }}
          token: ${{ secrets.AGENT_TEAM_READ_TOKEN }}
          path: .kernel/source
          persist-credentials: false
      - run: pnpm kernel:assemble
      - name: Verify locked kernel regressions
        run: pnpm --dir .kernel/source test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:packaging
      - run: pnpm package
      - name: Require native notification in the macOS development package
        id: native-notification
        if: runner.os == 'macOS'
        # 单项失败先留证并继续独立UI检查，末尾必须按原始outcome重新阻断整轮。
        continue-on-error: true
        env:
          WEFTPILOT_NOTIFICATION_DIAGNOSTICS: '1'
          ELECTRON_DEBUG_NOTIFICATIONS: '1'
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          export WEFTPILOT_PACKAGED_EXE="$(find "$PWD/release" -path '*/WeftPilot.app/Contents/MacOS/WeftPilot' -print -quit)"
          test -n "$WEFTPILOT_PACKAGED_EXE"
          export WEFTPILOT_PROBE_MODE=adhoc
          export WEFTPILOT_PROBE_REQUIRE_SHOWN=1
          signature="$(find "$PWD/release" -name development-signature.json -print -quit)"
          test -n "$signature"
          mkdir -p .tmp/evidence
          cp "$signature" .tmp/evidence/notification-platform-package.json
          pnpm exec tsx --tsconfig tsconfig.runtime.json tests/native/notification-platform-probe.ts
      - run: pnpm test:e2e
      - name: Packaged application (Windows)
        id: windows-packaged
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "started_at=$([DateTime]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $env:WEFTPILOT_PACKAGED_EXE = (Resolve-Path release/WeftPilot-win32-x64/WeftPilot.exe).Path
          $env:WEFTPILOT_E2E_LIFECYCLE = '1'
          $env:WEFTPILOT_E2E_RELEASE_INSPECTOR = '1'
          pnpm test:e2e
      - name: Windows application failure metadata
        if: failure() && runner.os == 'Windows' && steps.windows-packaged.outcome == 'failure'
        shell: pwsh
        run: ./build/windows-test-events.ps1 -StartedAt '${{ steps.windows-packaged.outputs.started_at }}'
      - name: Inspect source changes before installer
        run: |
          git status --short
          git diff --stat
          git diff -- pnpm-lock.yaml package.json pnpm-workspace.yaml
      - name: Assemble unsigned native validation installer
        run: pnpm package:installer --validation --validation-version 0.0.1
      - name: Packaged application (macOS)
        if: runner.os == 'macOS'
        run: |
          export WEFTPILOT_PACKAGED_EXE="$(find "$PWD/release" -path '*/WeftPilot.app/Contents/MacOS/WeftPilot' -print -quit)"
          test -n "$WEFTPILOT_PACKAGED_EXE"
          # 同名应用共享系统Keychain，独立userData不隔离它；先串行排除跨测试进程竞争。
          # 仍使用真实safeStorage，任何不可用照常失败，不使用mock-keychain或明文回退。
          pnpm exec tsx --tsconfig tsconfig.runtime.json --test --test-concurrency=1 tests/e2e/*.test.ts
      - name: Verify public skill sources in Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WEFTPILOT_PACKAGED_EXE = (Resolve-Path release/WeftPilot-win32-x64/WeftPilot.exe).Path
          $env:WEFTPILOT_REAL_SKILLS = '1'
          $env:WEFTPILOT_E2E_LIFECYCLE = '1'
          $env:WEFTPILOT_E2E_RELEASE_INSPECTOR = '1'
          pnpm exec tsx --tsconfig tsconfig.runtime.json --test --test-concurrency=1 tests/e2e/skill-workflow.test.ts tests/e2e/skill-import-recovery.test.ts
      - name: Verify public skill sources in macOS package
        if: runner.os == 'macOS'
        run: |
          export WEFTPILOT_PACKAGED_EXE="$(find "$PWD/release" -path '*/WeftPilot.app/Contents/MacOS/WeftPilot' -print -quit)"
          test -n "$WEFTPILOT_PACKAGED_EXE"
          export WEFTPILOT_REAL_SKILLS=1
          # 只下载本仓原创MIT技能的固定公共提交，不调用CLI模型、不传GitHub或飞书凭据。
          pnpm exec tsx --tsconfig tsconfig.runtime.json --test --test-concurrency=1 tests/e2e/skill-workflow.test.ts tests/e2e/skill-import-recovery.test.ts
      - name: Enforce original native notification outcome
        if: always() && !cancelled() && runner.os == 'macOS'
        env:
          NATIVE_NOTIFICATION_OUTCOME: ${{ steps.native-notification.outcome }}
        run: |
          # continue-on-error仅让独立检查继续，failed/skipped/空结果一律不能让整轮通过。
          test "$NATIVE_NOTIFICATION_OUTCOME" = success
      - name: Preserve project clipboard UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-clipboard-ui-${{ runner.os }}
          path: .tmp/evidence/project-git-copy-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native credential failure metadata
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: credential-availability-${{ runner.os }}
          path: .tmp/evidence/credential-availability-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native notification outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-notification-${{ runner.os }}
          path: |
            .tmp/evidence/notification-native-*.json
            .tmp/evidence/notification-platform-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve requirement UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirement-ui-${{ runner.os }}
          path: |
            .tmp/evidence/requirement-catalog-*.png
            .tmp/evidence/requirement-task-create-*.png
            .tmp/evidence/requirement-metadata-*.png
            .tmp/evidence/project-settings-*.png
            .tmp/evidence/team-catalog-*.png
            .tmp/evidence/role-feishu-*.png
            .tmp/evidence/skill-catalog-*.png
            .tmp/evidence/task-board-*.png
            .tmp/evidence/skill-download-errors-*.png
            .tmp/evidence/workbench-*.png
            .tmp/evidence/settings-connections-*.png
            .tmp/evidence/settings-notifications-*.png
            .tmp/evidence/appearance-drawer-*.png
            .tmp/evidence/skill-recovery-*.png
          if-no-files-found: warn
          retention-days: 7
