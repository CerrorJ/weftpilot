<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纬舟 WeftPilot · AI 团队工作台</title>
<link rel="stylesheet" href="src/styles.css">
<link rel="icon" type="image/svg+xml" href="assets/brand/app-icon.svg">
</head>
<body>
<div id="app" class="app">
<aside class="sidebar">
  <div class="wordmark"><img class="brand-mark" src="assets/brand/mark.svg" alt="纬舟标志"><div class="brand-name"><b>纬舟</b><small>WeftPilot</small></div></div>
  <div class="workspace-name"><div class="workspace-initial">A</div><div><strong style="font-size:11px">我的工作空间</strong><div style="font-size:9px;color:#8c9583">PERSONAL WORKSPACE</div></div><span class="spacer"></span><span style="color:#949d8a">⌄</span></div>
  <div class="nav-label">WORKSPACE</div><nav class="nav" id="nav" aria-label="主导航"></nav>
  <div class="side-bottom"><div class="runtime-box"><span class="dot" style="color:#8b9f78"></span>交互原型 · 演示数据</div><nav class="nav"><button data-page="settings" id="settings-nav" title="设置"><span data-icon="settings"></span><span>设置</span></button></nav><div class="account"><div class="avatar dark">我</div><div><strong style="font-size:11px">我的团队</strong><div style="font-size:10px;color:#909986">本地工作空间</div></div></div></div>
</aside>
<div class="main-shell" id="main-shell"><header class="topbar"><div class="crumb"><span>工作空间</span><span style="opacity:.4">/</span><strong id="crumb-name">任务管理</strong></div><div class="top-actions"><span class="pill">V2 · 交互演示</span><button class="icon-btn" data-page="home" aria-label="查看待我处理"><span data-icon="bell"></span></button><div class="avatar" style="width:25px;height:25px;font-size:10px">我</div></div></header><main class="screen" id="screen"></main></div>
<div id="drawer-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
</div>
<script src="src/app.js"></script>
</body>
</html>
